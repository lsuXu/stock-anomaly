                formatter: function (params) {
                    const kParam = params.find(p => p.seriesName === '日K');
                    const vParam = params.find(p => p.seriesName === '成交量');
                    if (!kParam) return '';
                    const d = kParam.data;
                    const date = kParam.axisValue;
                    const open = d[1], close = d[2], lowest = d[3], highest = d[4];
                    const chgPct = (((close - open) / open) * 100).toFixed(2);
                    const chgColor = close >= open ? '#f43f5e' : '#10b981';
                    
                    let html = `<div style="font-weight:700;margin-bottom:4px;border-bottom:1px solid #334155;padding-bottom:4px;">${date}</div>`;
                    html += `开盘: <b>${open}</b> 元<br/>`;
                    html += `收盘: <b style="color:${chgColor}">${close}</b> 元 (${chgPct >= 0 ? '+' : ''}${chgPct}%)<br/>`;
                    html += `最高: <b>${highest}</b> 元<br/>`;
                    html += `最低: <b>${lowest}</b> 元<br/>`;
                    if (vParam) {
                        html += `成交量: <b>${(vParam.value / 100).toFixed(0)}</b> 手<br/>`;
                    }
                    params.forEach(p => {
                        if (p.seriesName.startsWith('MA')) {
                            html += `<span style="color:${p.color}">${p.seriesName}: ${p.value}</span> `;
                        }
                    });
                    return html;
                }
            },
            legend: {
                data: ['日K', 'MA5', 'MA10', 'MA20', 'MA30'],
                textStyle: { color: '#94a3b8' },
                top: 0
            },
            axisPointer: {
                link: [{ xAxisIndex: 'all' }]
            },
            grid: [
                { left: '4%', right: '4%', top: '8%', height: '60%' },
                { left: '4%', right: '4%', top: '74%', height: '18%' }
            ],
            xAxis: [
                {
                    type: 'category',
                    data: dates,
                    boundaryGap: true,
                    axisLine: { lineStyle: { color: '#334155' } },
                    axisLabel: { color: '#94a3b8' },
                    axisTick: { show: false },
                    splitLine: { show: false }
                },
                {
                    type: 'category',
                    gridIndex: 1,
                    data: dates,
                    boundaryGap: true,
                    axisLine: { lineStyle: { color: '#334155' } },
                    axisLabel: { show: false },
                    axisTick: { show: false },
                    splitLine: { show: false }
                }
            ],
            yAxis: [
                {
                    scale: true,
                    axisLine: { show: false },
                    axisLabel: { color: '#94a3b8' },
                    splitLine: { lineStyle: { color: 'rgba(255, 255, 255, 0.06)' } }
                },
                {
                    scale: true,
                    gridIndex: 1,
                    splitNumber: 2,
                    axisLabel: { show: false },
                    axisLine: { show: false },
                    axisTick: { show: false },
                    splitLine: { show: false }
                }
            ],
            dataZoom: [
                {
                    type: 'inside',
                    xAxisIndex: [0, 1],
                    start: 80,
                    end: 100
                },
                {
                    show: true,
                    xAxisIndex: [0, 1],
                    type: 'slider',
                    bottom: '2%',
                    start: 80,
                    end: 100,
                    textStyle: { color: '#94a3b8' },
                    borderColor: '#233354',
                    fillerColor: 'rgba(37, 99, 235, 0.2)'
                }
            ],
            series: [
                {
                    name: '日K',
                    type: 'candlestick',
                    data: ohlc,
                    itemStyle: {
                        color: '#f43f5e',
                        color0: '#10b981',
                        borderColor: '#f43f5e',
                        borderColor0: '#10b981'
                    },
                    markLine: {
                        symbol: ['none', 'none'],
                        data: [
                            crit3d > 0 ? {
                                yAxis: crit3d,
                                name: '3日异动线',
                                lineStyle: { color: '#f59e0b', type: 'dashed', width: 2 },
                                label: { formatter: '3日异动: {c}元', position: 'end', color: '#f59e0b' }
                            } : null,
                            crit10d > 0 ? {
                                yAxis: crit10d,
                                name: '10日严重异动线',
                                lineStyle: { color: '#ef4444', type: 'dotted', width: 2 },
                                label: { formatter: '10日红线: {c}元', position: 'end', color: '#ef4444' }
                            } : null
                        ].filter(Boolean)
                    }
                },
                {
                    name: 'MA5',
                    type: 'line',
                    data: calculateMA(5),
                    smooth: true,
                    showSymbol: false,
                    lineStyle: { width: 1.5, color: '#f59e0b' }
                },
                {
                    name: 'MA10',
                    type: 'line',
                    data: calculateMA(10),
                    smooth: true,
                    showSymbol: false,
                    lineStyle: { width: 1.5, color: '#38bdf8' }
                },
                {
                    name: 'MA20',
                    type: 'line',
                    data: calculateMA(20),
                    smooth: true,
                    showSymbol: false,
                    lineStyle: { width: 1.5, color: '#a855f7' }
                },
                {
                    name: 'MA30',
                    type: 'line',
                    data: calculateMA(30),
                    smooth: true,
                    showSymbol: false,
                    lineStyle: { width: 1.5, color: '#ec4899' }
                },
                {
                    name: '成交量',
                    type: 'bar',
                    xAxisIndex: 1,
                    yAxisIndex: 1,
                    data: volumes,
                    itemStyle: {
                        color: function (params) {
                            const i = params.dataIndex;
                            return ohlc[i][1] >= ohlc[i][0] ? 'rgba(244, 63, 94, 0.7)' : 'rgba(16, 185, 129, 0.7)';
                        }
                    }
                }
            ]
        };

        chart.setOption(option);
        window.addEventListener('resize', () => chart.resize());

        function setRange(days) {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');

            const total = dates.length;
            let start = 0;
            if (days > 0 && days < total) {
                start = Math.max(0, Math.floor(((total - days) / total) * 100));
            }
            chart.dispatchAction({
                type: 'dataZoom',
                start: start,
                end: 100
            });
        }

        // 默认定位到最近 60 天
        setRange(60);
    </script>
</body>
</html>
